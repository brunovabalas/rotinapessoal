<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina da Casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F4F6F2; --surface:#FFFFFF; --surface-2:#EDF1EA; --ink:#17201A; --ink-2:#3E4A42; --muted:#6E7B72;
  --line:#DFE5DD; --line-2:#CBD4C8;
  --accent:#1F6E5B; --accent-ink:#FFFFFF; --accent-soft:#DDF0E7; --accent-soft-ink:#175646;
  --warn:#A8701B; --warn-soft:#F7ECD6; --danger:#B0394A; --danger-soft:#F8E1E4; --good:#2E7D4F; --good-soft:#DFF2E5;
  --bruno:#2C5F8A; --bruna:#9A4C7A;
  --chat-bg:#E9E4DA; --chat-in:#FFFFFF; --chat-out:#D9F5DB; --chat-bar:#1F6E5B;
  --shadow:0 1px 2px rgba(23,32,26,.06), 0 8px 24px rgba(23,32,26,.06);
  --r:14px; --r-sm:9px;
  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
  --font-body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#171F1A; --surface-2:#1F2923; --ink:#E7EDE8; --ink-2:#C2CCC5; --muted:#8B978F;
    --line:#26312A; --line-2:#354139;
    --accent:#5DC39C; --accent-ink:#0B1610; --accent-soft:#1B2F27; --accent-soft-ink:#9EE0C4;
    --warn:#E0A94A; --warn-soft:#332A17; --danger:#E27A8A; --danger-soft:#3A1E24; --good:#6CCB8E; --good-soft:#18301F;
    --bruno:#7FB3E0; --bruna:#D48BB8;
    --chat-bg:#0B0F0D; --chat-in:#1E2A23; --chat-out:#1F4A34; --chat-bar:#132A22;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#171F1A; --surface-2:#1F2923; --ink:#E7EDE8; --ink-2:#C2CCC5; --muted:#8B978F;
  --line:#26312A; --line-2:#354139;
  --accent:#5DC39C; --accent-ink:#0B1610; --accent-soft:#1B2F27; --accent-soft-ink:#9EE0C4;
  --warn:#E0A94A; --warn-soft:#332A17; --danger:#E27A8A; --danger-soft:#3A1E24; --good:#6CCB8E; --good-soft:#18301F;
  --bruno:#7FB3E0; --bruna:#D48BB8;
  --chat-bg:#0B0F0D; --chat-in:#1E2A23; --chat-out:#1F4A34; --chat-bar:#132A22;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px;line-height:1.15}
h2{font-size:20px;line-height:1.2}
h3{font-size:15px;line-height:1.3}
p{margin:0}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.big{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr) 380px;height:100%;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:18px}
.brand b{display:block;font-family:var(--font-display);font-weight:600;font-size:17px}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:600;font-size:13.5px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--surface-2)}
.nav button.active{background:var(--accent-soft);color:var(--accent-soft-ink)}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px;line-height:1.5}

.main{overflow:auto;padding-block:22px 32px;padding-inline:26px}
.main-inner{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topbar .date{color:var(--muted);font-size:13px;margin-top:4px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.seg button .dot{width:8px;height:8px;border-radius:50%;background:var(--m-color,var(--muted))}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.screen{display:none;flex-direction:column;gap:18px}
.screen.active{display:flex}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.card.flat{background:var(--surface-2);border-color:transparent}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head .link{font-size:12.5px;font-weight:700;color:var(--accent);background:none;border:0;padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* tiles */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.tile .lab span:last-child{font-size:11px;text-align:right;white-space:nowrap}
.tile .val{display:flex;align-items:baseline;gap:6px}
.tile .val small{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.bar i.warn{background:var(--warn)}
.bar i.good{background:var(--good)}

/* ring */
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--surface-2)}
.ring .prog{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .lbl b{font-family:var(--font-display);font-size:22px;font-weight:600}
.ring .lbl span{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hero{display:flex;align-items:center;gap:18px}
.hero .txt{display:flex;flex-direction:column;gap:4px;min-width:0}

/* timeline */
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tl-row:first-child{border-top:0}
.tl-row .t{font-weight:800;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-row .t.now{color:var(--accent)}
.tl-row .ttl{font-weight:700}
.tl-row .sub{font-size:12.5px;color:var(--muted)}
.tl-row.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.tl-row.done .t{color:var(--good)}
.chk{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);display:grid;place-items:center;padding:0}
.chk svg{width:15px;height:15px;stroke:var(--accent-ink);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on svg{opacity:1}
.chk.skip{background:var(--surface-2);border-style:dashed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent-soft-ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.dan{background:var(--danger-soft);color:var(--danger)}
.pill.bruno{background:color-mix(in srgb,var(--bruno) 16%,transparent);color:var(--bruno)}
.pill.bruna{background:color-mix(in srgb,var(--bruna) 16%,transparent);color:var(--bruna)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:600}
.li .sub{font-size:12.5px;color:var(--muted)}
.li.done .ttl{text-decoration:line-through;color:var(--muted);text-decoration-color:var(--line-2)}
.btn{border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:var(--r-sm);font-weight:700;font-size:13px;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:6px}
.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px}
.input.sm{width:72px;padding:5px 8px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr.today td{background:var(--accent-soft)}
.tablewrap{overflow-x:auto}
.note{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;font-size:12.5px;color:var(--ink-2)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.dan{background:var(--danger-soft);color:var(--danger)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px}
.kv b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted)}
.tabs button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.exo{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.exo:first-child{border-top:0}
.exo .n{font-weight:600}
.exo .rx{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.exo.cardio{background:var(--surface-2);margin:0 -18px;padding-inline:18px;border-radius:0}
.exo.cardio .n{color:var(--accent-soft-ink)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface-2);border-radius:var(--r-sm);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:5px;min-width:0}
.day.today{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.day .dn{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .dn b{display:block;font-family:var(--font-display);font-size:18px;color:var(--ink);letter-spacing:0;font-weight:600}
.ev{font-size:11px;line-height:1.25;padding:4px 6px;border-radius:6px;background:var(--surface);border-left:3px solid var(--accent);overflow:hidden;text-overflow:ellipsis}
.ev b{display:block;font-variant-numeric:tabular-nums;font-size:10.5px;color:var(--muted)}
.ev.appointment{border-left-color:var(--warn)}
.ev.church{border-left-color:var(--bruna)}
.ev.weigh_in{border-left-color:var(--bruno)}
.ev.leisure{border-left-color:var(--good)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .l1{stroke:var(--bruno);fill:none;stroke-width:2.2;stroke-linejoin:round}
.chart .l2{stroke:var(--bruna);fill:none;stroke-width:2.2;stroke-linejoin:round}
.chart .p1{fill:var(--bruno)} .chart .p2{fill:var(--bruna)}
.chart .a1{fill:var(--bruno);opacity:.08} .chart .a2{fill:var(--bruna);opacity:.08}
.chart .bar1{fill:var(--accent)} .chart .bar0{fill:var(--surface-2)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toggle{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line-2);border:0;padding:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:19px}
.goal .bar{margin-top:8px}
.book{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.book .cover{width:44px;height:62px;border-radius:5px;background:linear-gradient(160deg,var(--accent),var(--bruno));display:grid;place-items:end start;padding:5px;color:#fff;font-family:var(--font-display);font-size:11px;line-height:1.05;font-weight:600}
.msglog{font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.msglog div{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.msglog div:first-child{border-top:0}

/* ---------- chat column ---------- */
.chat{display:flex;flex-direction:column;background:var(--chat-bg);border-left:1px solid var(--line);min-height:0}
.chat-top{background:var(--chat-bar);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.chat-top .av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--font-display);font-weight:700}
.chat-top b{display:block;font-size:14px}
.chat-top span{font-size:11.5px;opacity:.85}
.chat-top .who{margin-left:auto;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.chat-log{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;min-height:0}
.bub{max-width:88%;padding:8px 11px;border-radius:12px;font-size:13.5px;line-height:1.4;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:pre-wrap;word-wrap:break-word;position:relative}
.bub.in{align-self:flex-start;background:var(--chat-in);border-top-left-radius:4px}
.bub.out{align-self:flex-end;background:var(--chat-out);border-top-right-radius:4px}
.bub .tm{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.bub .btns{display:flex;flex-direction:column;gap:5px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.bub .btns button{border:0;background:var(--surface-2);color:var(--accent);font-weight:700;padding:7px;border-radius:8px;font-size:13px}
.bub .btns button:disabled{opacity:.5;cursor:default}
.bub.sys{align-self:center;background:transparent;box-shadow:none;font-size:11px;color:var(--muted);text-align:center;max-width:100%}
.chat-chips{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto;flex:none}
.chat-chips button{flex:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.chat-in{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));flex:none}
.chat-in input{flex:1;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:10px 14px;min-width:0}
.chat-in button{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.chat-in button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sim{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap;flex:none}
.sim span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);align-self:center}
.sim button{border:1px dashed var(--line-2);background:transparent;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sim button:hover{border-style:solid;color:var(--ink)}

/* mobile tab bar */
.tabbar{display:none}
@media (max-width:1100px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .chat{position:fixed;inset:0;left:0;z-index:20;display:none;border-left:0}
  .chat.open{display:flex}
  .chat-top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .chat-top .close{display:inline-grid}
}
.chat-top .close{display:none;background:transparent;border:0;color:#fff;place-items:center;width:32px;height:32px;padding:0;border-radius:50%}
.chat-top .close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-inline:16px;padding-block:16px 96px}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:minmax(0,1fr)}
  .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .day{padding:5px 4px;min-height:96px}
  .day .dn{font-size:9px}
  .ev{font-size:9.5px;padding:3px 4px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:10;gap:2px;overflow-x:auto}
  .tabbar button{flex:1 0 auto;min-width:56px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:var(--muted);padding:4px 2px;border-radius:8px}
  .tabbar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button.active{color:var(--accent)}
  .big{font-size:26px}
  .tile .lab{flex-direction:column;align-items:flex-start;gap:0}
  .tile .lab span:last-child{text-align:left}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark">R</div><div><b>Rotina da Casa</b><span>Bruno &amp; Bruna · beta</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Protótipo navegável com dados de exemplo. Nada aqui é salvo. Abra o WhatsApp à direita e digite, por exemplo, <em>"pesei 79,2"</em> ou <em>"põe azeite na lista"</em>.</div>
  </aside>

  <main class="main">
    <div class="main-inner">

function lineChart(series,labels,opts){

  g+=labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`).join('');
  series.forEach((s,si)=>{const pts=s.v.map((v,i)=>`${x(i)},${y(v)}`).join(' ');g+=`<polygon class="a${si+1}" points="${x(0)},${y(mn)} ${pts} ${x(s.v.length-1)},${y(mn)}"/><polyline class="l${si+1}" points="${pts}"/>`;s.v.forEach((v,i)=>{g+=`<circle class="p${si+1}" cx="${x(i)}" cy="${y(v)}" r="${i===s.v.length-1?4.5:3}"/>`;if(i===s.v.length-1)g+=`<text x="${x(i)-8}" y="${y(v)-9}" text-anchor="end" style="font-weight:700;fill:var(--ink)">${v.toFixed(1)}${opts.unit}</text>`;});});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label}">${g}</svg>`;
}

  const dowRe=/(segunda|terça|terca|quarta|quinta|sexta|sábado|sabado|domingo|amanhã|amanha|hoje)/;
  r=l.match(dowRe);const hr=l.match(/(?:às|as)\s*(\d{1,2})(?::(\d{2}))?\s*h?|(\d{1,2})h(\d{2})?/);
  if(r&&hr&&!acts.length&&/reuni|consulta|dentista|médic|medic|jantar com|almoço com|passeio|visita|aniversário|aniversario|culto|encontro|cinema|viagem/.test(l)){const names={segunda:1,'terça':2,terca:2,quarta:3,quinta:4,sexta:5,'sábado':6,sabado:6,domingo:0};let dow=names[r[1]];if(r[1].startsWith('amanh'))dow=(WD+1)%7;if(r[1]==='hoje')dow=WD;const h=hr[1]||hr[3],mi=hr[2]||hr[4]||'00';const both=/nós dois|nos dois|ambos|com a bruna|com o bruno|casal/.test(l);let title=t.replace(new RegExp(dowRe.source,'i'),'').replace(/(?:às|as)\s*\d{1,2}(?::\d{2})?\s*h?|\d{1,2}h\d{0,2}/i,'').replace(/nós dois|nos dois|ambos|,|\bque vem\b/gi,'').replace(/\s+/g,' ').trim();title=title.charAt(0).toUpperCase()+title.slice(1);const type=/culto|igreja|célula|celula/.test(l)?'church':/jantar|almoço|passeio|cinema/.test(l)?'leisure':'appointment';const past=dayOf(dow)<new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate())||(dow===WD&&toMin(`${pad(h)}:${mi}`)<nowMin);EVENTS.push({dow,t:`${pad(h)}:${mi}`,title,type,who:both?['bruno','bruna']:[m],rem:30,next:past});acts.push('ev');out.push(`📅 ${WDN[dow]} ${fmtDate(nextDateOf(dow))}, ${pad(h)}:${mi} — ${title}. Lembro 30 min antes.${both?' Para vocês dois.':''}`);if(!both)return reply(out.join('\n'),[['Só eu',()=>{}],['Nós dois',()=>{EVENTS[EVENTS.length-1].who=['bruno','bruna'];addMsg('in','✅ Marcado para os dois.');}]]);}
  /* livros */
  r=t.match(/comecei\s+(?:a ler\s+|o livro\s+)?(.+?)(?:,\s*(\d+)\s*p[áa]g)?\s*$/i);
  if(r&&!acts.length){BOOKS.unshift({who:m,t:r[1].replace(/^["“]|["”]$/g,''),a:'',pages:r[2]?+r[2]:300,cur:0,days:1,status:'reading'});acts.push('b');out.push(`📖 "${r[1]}" adicionado${r[2]?` (${r[2]} páginas)`:''}. Me diga a página quando parar de ler que eu acompanho o ritmo.`);}
  r=l.match(/li at[ée] a (?:p[áa]gina )?(\d+)|(?:estou|tô|to) na (?:p[áa]gina )?(\d+)/);
  if(r){const b=BOOKS.find(x=>x.who===m&&x.status==='reading');if(b){const pg=+(r[1]||r[2]);const delta=pg-b.cur;b.cur=pg;if(pg>=b.pages){b.status='done';out.push(`🎉 "${b.t}" concluído. ${BOOKS.filter(x=>x.who===m&&x.status==='done').length} livros no ano.`);}else{const rate=Math.max(1,Math.round(b.cur/b.days));out.push(`📖 "${b.t}": página ${pg} de ${b.pages}${delta>0?` (+${delta})`:''}. No ritmo atual, termina em ~${Math.ceil((b.pages-pg)/rate)} dias.`);}acts.push('b');}}
  /* metas */
  r=t.match(/meta[:\s]+(.+?)\s+(?:até|ate)\s+(.+)$/i);if(r&&!acts.length){GOALS.push({who:m,t:r[1],cat:'pessoal',cur:0,from:0,to:100,unit:'%'});acts.push('g');out.push(`🎯 Meta criada: "${r[1]}" até ${r[2]}. Pergunto o progresso toda semana.`);}
  /* consultas */
  if(!acts.length){
    if(/o que (é|e|tem)( o| de)? (almoço|almoco|jantar|café|cafe|lanche)|(almoço|jantar|café|lanche) de hoje/.test(l)){const slot=/almo/.test(l)?'lunch':/jant/.test(l)?'dinner':/caf/.test(l)?'breakfast':'snack';const name=mealsToday()[slot];return reply(name?`${SLOTS[slot]} de hoje: *${name}*.\nBruno: ${PORTION.bruno[slot].d} (${PORTION.bruno[slot].k} kcal).\nBruna: ${PORTION.bruna[slot].d} (${PORTION.bruna[slot].k} kcal).`:`Hoje não tem ${SLOTS[slot].toLowerCase()} previsto.`);}
    if(/quanto falta|como (tô|to|estou)|resumo|meu dia|status/.test(l)){const tt=totals(m);return reply(`*Hoje, ${M.name}:*\n• ${tt.k} de ${M.kcal} kcal · ${tt.p} de ${M.protMin}–${M.protMax} g prot\n• ${(tt.water/1000).toLocaleString('pt-BR')} L de ${M.water/1000} L água\n• ${tt.steps.toLocaleString('pt-BR')} de ${M.steps.toLocaleString('pt-BR')} passos\n• Treino: ${s.workout?'✅':'ainda não'}\n• Rotina: ${routinePct(m)}% até agora`);}
    if(/treino (de )?hoje|qual (é|e) o treino|o que treino/.test(l)){const w=workoutToday(m);return reply(w?`*${WDS[WD]} — ${w.title}*\nCardio ${w.cardio[0]} min leve${w.cardio[1]?` + ${w.cardio[1]} min moderado no meio`:''} + ${w.cardio[2]} min no final.\n${w.ex.map(e=>`• ${e[0]} ${e[1]}`).join('\n')}`:'Hoje não tem musculação. Caminhada de 40–60 min e passos.');}
    if(/agenda|compromissos|o que tem (hoje|amanhã|amanha|essa semana)|próximos/.test(l)){const up=upcoming(m);return reply(up.length?`*Próximos compromissos:*\n${up.map(e=>`• ${e.dayIdx===0?'hoje':e.dayIdx===1?'amanhã':WDN[e.dow]} ${e.t} — ${e.title}${e.who.length>1?' (ambos)':''}`).join('\n')}`:'Nada marcado nos próximos dias.');}
    if(/tarefas|afazeres|o que (tenho|preciso) fazer/.test(l)){const op=TASKS.filter(x=>!x.done);return reply(`*Tarefas abertas:*\n${op.map(x=>`• ${x.t} — ${x.due} (${MEMBERS[x.who].name})`).join('\n')}`);}
    if(/livro|leitura|lendo/.test(l)){const b=BOOKS.find(x=>x.who===m&&x.status==='reading');return reply(b?`Você está em "${b.t}", página ${b.cur} de ${b.pages}. Ritmo: ~${Math.round(b.cur/b.days)} páginas/dia.`:'Nenhum livro em leitura. "comecei X, 300 páginas" para adicionar.');}
    if(/metas?\b/.test(l)){return reply(`*Suas metas:*\n${GOALS.filter(g=>g.who===m||g.who==='casa').map(g=>`• ${g.t} — ${g.cur}${g.unit==='R$'?'':' '+g.unit} de ${g.to}`).join('\n')}`);}
    if(/^(oi|olá|ola|bom dia|boa tarde|boa noite|e aí|eai)\b/.test(l)){const nx=nextItem(m);return reply(`Oi, ${M.name}. ${nx?`Próximo da rotina: ${nx.title} às ${nx.t}.`:'Rotina de hoje concluída.'} Posso registrar refeição, água, passos, peso, treino, tarefas, lista de mercado, compromissos e leitura.`);}
    if(/obrigad|valeu|show|top/.test(l))return reply('👍');
    return reply('Não entendi. Exemplos do que posso fazer:\n• "almoço feito" · "comi um pastel"\n• "2 copos de água" · "7 mil passos" · "pesei 79,2"\n• "treino feito, esforço 7"\n• "põe azeite e 2 kg de frango na lista" · "manda a lista"\n• "reunião com o contador terça 15h"\n• "lembra de pagar a luz sexta"\n• "li até a 160" · "quanto falta?"');
  }
  reply(out.join('\n'));
}

/* proativas simuladas */
const SIM = [
  ['07:10',()=>{const m=member;reply('Bom dia. Hora do devocional — 20 minutos antes do resto do dia.',[['Feito ✅',()=>{S[m].done.add('dev');}],['Pular hoje',()=>{S[m].done.add('dev');}]]);}],
  ['07:35',()=>{const m=member,slot='breakfast',name=mealsToday()[slot];reply(`Café de hoje: *${name}*.\nBruno: ${PORTION.bruno[slot].d}. Bruna: ${PORTION.bruna[slot].d}.`,[['Comi ✅',()=>{const P=PORTION[m][slot];logMeal(m,slot,name,P.k,P.p,true,false);S[m].done.add('cafe');}],['Outra coisa',()=>{S[m].pending={tool:'meal_other',slot};addMsg('in','O que você comeu?');}]]);}],
  ['08:00',()=>{const wb=workoutToday('bruno'),wa=workoutToday('bruna');reply(wb?`${WDN[WD].split('-')[0].replace(/^./,c=>c.toUpperCase())}: Bruno — ${wb.title} (cardio ${wb.cardio.filter(Boolean).join('/')} min). Bruna — ${wa.title} (cardio ${wa.cardio.filter(Boolean).join('/')} min). Comecem com 8 min leves.`:'Fim de semana: sem musculação obrigatória. Caminhada de 40–60 min juntos?',[['Comecei',()=>{addMsg('in','Bom treino. Me avisa quando terminar.');}],['Descanso hoje',()=>{S[member].mode='rest';}]]);}],
  ['12:30',()=>{const m=member,slot='lunch',name=mealsToday()[slot];if(S[m].meals[slot]){addMsg('sys','12:30 · lembrete de almoço suprimido: já registrado');return;}reply(`Almoço: *${name}*. Bruno e Bruna comem a mesma preparação com porções diferentes.\nSua porção: ${PORTION[m][slot].d}.`,[['Comi ✅',()=>{const P=PORTION[m][slot];logMeal(m,slot,name,P.k,P.p,true,false);S[m].done.add('almoco');}],['Refeição fora',()=>{S[m].mode='eating_out';addMsg('in','Ok. Prioriza proteína + vegetais e me conta depois o que comeu. Se for a refeição flexível, é só dizer.');}]]);}],
  ['18:00',()=>{const m=member,M=MEMBERS[m],st=S[m].steps;if(S[m].mode==='rest'||S[m].mode==='travel'){addMsg('sys','18:00 · nudge de passos suprimido: modo '+S[m].mode);return;}if(st>=M.steps*0.6){addMsg('sys','18:00 · nudge de passos suprimido: acima de 60% da meta');return;}reply(`${st.toLocaleString('pt-BR')} passos até agora. Faltam ~${(M.steps-st).toLocaleString('pt-BR')} para a meta — uma volta de 20 min resolve.`,[['Vou agora',()=>{addMsg('in','Boa. Me manda o total depois.');}],['Hoje não dá',()=>{}]]);}],
  ['22:15',()=>{const m=member,s=S[m],tt=totals(m),M=MEMBERS[m];reply(`Check-in do dia, ${M.name}:\n• Treino: ${s.workout?'✅':'sem registro'}\n• ${tt.k} kcal · ${tt.p} g prot\n• Água ${(tt.water/1000).toLocaleString('pt-BR')} L · ${tt.steps.toLocaleString('pt-BR')} passos\nAmanhã: ${(()=>{const e=upcoming(m).find(x=>x.dayIdx===1);return e?e.title+' às '+e.t:'nada fora da rotina';})()}.`,[[s.workout?'Tudo certo ✅':'Treino feito ✅',()=>{s.workout=true;s.done.add('checkin');addMsg('in','Registrado. Bom descanso — amanhã 07:10 devocional.');}],['Passos: informar',()=>{s.pending={tool:'steps'};addMsg('in','Quantos passos hoje?');}],['Amanhã é diferente',()=>{addMsg('in','Me conta o que muda que eu ajusto só o dia de amanhã.');}]]);}]
];
document.getElementById('sim').insertAdjacentHTML('beforeend',SIM.map(([t],i)=>`<button type="button" data-sim="${i}">${t}</button>`).join(''));
const CHIPS=['almoço feito','2 copos de água','7 mil passos','pesei 79,2','treino feito, esforço 7','põe azeite e 2 kg de frango na lista','manda a lista','reunião com o contador terça 15h','lembra de pagar a luz sexta','li até a 160','quanto falta?','o que é o jantar hoje?','modo viagem'];
document.getElementById('chips').innerHTML=CHIPS.map(c=>`<button type="button" data-chip="${esc(c)}">${esc(c)}</button>`).join('');

/* ===================== EVENTOS ===================== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.s){screen=d.s;render();document.querySelector('.main').scrollTop=0;return;}
  if(d.go){screen=d.go;render();return;}
  if(d.m){member=d.m;render();return;}
  if(d.chat||b.id==='openchat'){document.getElementById('chat').classList.add('open');return;}
  if(b.id==='closechat'){document.getElementById('chat').classList.remove('open');return;}
  if(b.id==='chatwho'){member=member==='bruno'?'bruna':'bruno';addMsg('sys',`agora falando como ${MEMBERS[member].name}`);render();return;}
  if(d.r){const s=S[member];if(s.done.has(d.r))s.done.delete(d.r);else s.done.add(d.r);render();return;}
  if(d.meal){const P=PORTION[member][d.meal];logMeal(member,d.meal,mealsToday()[d.meal],P.k,P.p,true,false);render();return;}
  if(d.tg){b.classList.toggle('on');return;}
  if(d.mode){S[member].mode=d.mode;render();return;}
  if(d.slot){mealSel=d.slot;render();return;}
  if(d.wd){wSel=+d.wd;render();return;}
  if(d.wdone){S[member].workout=true;S[member].rpe=S[member].rpe||7;S[member].done.add('treino');render();return;}
  if(d.shop){const [n,i]=d.shop.split('|');SHOP[n][+i].c=!SHOP[n][+i].c;render();return;}
  if(d.task){const t=TASKS.find(x=>String(x.id)===d.task);t.done=!t.done;render();return;}
  if(d.cl){CHECKLIST.items[+d.cl].d=!CHECKLIST.items[+d.cl].d;render();return;}
  if(d.reset){CHECKLIST.items.forEach(i=>i.d=false);render();return;}
  if(d.pref){PREFS[member][d.pref]=!PREFS[member][d.pref];render();return;}
  if(d.sim){SIM[+d.sim][1]();return;}
  if(d.chip){send(d.chip);return;}
});
function send(text){if(!text.trim())return;addMsg('out',text);agent(text);}
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('chatinput');send(i.value);i.value='';});

/* boot */
addMsg('sys',`hoje · ${WDN[WD]}, ${fmtDate(NOW)}`);
addMsg('in','Bom dia. Hora do devocional — 20 minutos antes do resto do dia.');
addMsg('out','Feito ✅');
addMsg('in',`Café de hoje: *${mealsToday().breakfast}*.\nBruno: ${PORTION.bruno.breakfast.d}. Bruna: ${PORTION.bruna.breakfast.d}.`);
addMsg('out','Comi ✅');
addMsg('in',`✅ Café registrado (${PORTION.bruno.breakfast.k} kcal, ${PORTION.bruno.breakfast.p} g prot). ${isWeekday?`Treino às 08:00: ${workoutToday('bruno').title}.`:'Caminhada às 09:30.'}`);
if(isWeekday){addMsg('out','treino feito, esforço 7');addMsg('in',`💪 Treino registrado — ${workoutToday('bruno').title} (RPE 7). 4º da semana. Lanche pós-treino: ${mealsToday().post_workout}, sua porção ${PORTION.bruno.post_workout.d}.`);}
addMsg('sys','digite abaixo ou toque em um exemplo · o painel à esquerda reage');
render();
})();
